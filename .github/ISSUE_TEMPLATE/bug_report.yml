name: Something went wrong
description: An install, download, start or answer that did not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what it printed (paste the end of the output).
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: The output of `nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader`
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: RAM and Linux version
      placeholder: 64 GB, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [fast, precise]
