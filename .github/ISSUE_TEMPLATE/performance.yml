name: Bench result or slow speed
description: Share how fast it runs on your hardware, or report that it is slower than expected.
labels: [performance]
body:
  - type: textarea
    id: report
    attributes:
      label: Bench block
      description: With the server running, run `tools/bench.sh` (about 5 minutes). Paste the block it prints at the end, between "paste from here" and "to here".
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Context size, other programs running, anything that broke. PCIe "now" can read low when the GPU is idle; the "max" value is the one that matters.
