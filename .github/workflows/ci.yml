name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for f in setup.sh tools/*.sh bench/*.sh; do bash -n "$f"; done
      - name: Flowchart renderer
        run: node tests/test_flow.js
